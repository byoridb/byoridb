[package]
name = "byoridb-kvstore"
version = "0.1.0"
edition = "2021"

[features]
# RocksDB backend (RocksdbKVStore / WalKVStore / backup). Requires a C++
# toolchain. Off by default so pure-Rust embedders (MemoryKVStore + the KVStore
# trait) don't pull in librocksdb-sys.
default = []
rocksdb = ["dep:rocksdb"]

[dependencies]
byoridb-common = { path = "../byoridb-common" }
rocksdb = { workspace = true, optional = true }
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }
parking_lot = { workspace = true }
futures = { workspace = true }
tokio-stream = { workspace = true }
crc32fast = "1.4"

# Raft - temporarily disabled
# openraft = { workspace = true }

[dev-dependencies]
tempfile = "3.10"
criterion = "0.5"

[[bench]]
name = "wal_overhead"
harness = false
required-features = ["rocksdb"]

[lints]
workspace = true
