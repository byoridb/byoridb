[package]
name = "byoridb-storage"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[build-dependencies]
tonic-prost-build = "0.14"

[features]
default = []
# Enables the gRPC RPC layer (proto types + StorageRpcService + StorageServer).
# Pulls in tonic (→ axum/hyper/mio/socket2) which cannot compile to wasm32. Off
# for embedded; StorageEnv and the storage *types* (index, key, codec, errors,
# raft) are pure-Rust and always available (redb-backed, no C++ toolchain).
distributed = ["dep:tonic", "dep:tonic-prost", "dep:prost"]

[dependencies]
byoridb-common = { path = "../byoridb-common" }
byoridb-kvstore = { path = "../byoridb-kvstore" }
byoridb-codec = { path = "../byoridb-codec" }
byoridb-meta = { path = "../byoridb-meta" }
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
tonic = { workspace = true, optional = true }
tonic-prost = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
tokio-stream = "0.1"
bincode.workspace = true
byteorder = "1.5.0"
rand = "0.8"

[lints]
workspace = true
