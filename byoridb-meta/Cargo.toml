[package]
name = "byoridb-meta"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[features]
default = []
# Enables MetaServer (server.rs). It serves gRPC (MetaServiceServer) and an
# axum HTTP layer, so it pulls in axum and the gRPC `distributed` layer. The KV
# backend (redb) is always available, no feature needed.
server = ["dep:axum", "distributed"]
# Enables the gRPC layer (proto + MetaClient/StorageClient/rpc/service). Pulls
# in tonic (→ axum/hyper/mio), not wasm-compatible. The pure metadata *types*
# (schema, hotspot, key, error) stay available to the embedded build.
distributed = ["dep:tonic", "dep:tonic-prost", "dep:prost"]

[dependencies]
byoridb-common = { path = "../byoridb-common" }
byoridb-kvstore = { path = "../byoridb-kvstore" }
byoridb-codec = { path = "../byoridb-codec" }
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
dashmap = { workspace = true }
tonic = { workspace = true, optional = true }
tonic-prost = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
tokio-stream = "0.1"
axum = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tonic-prost-build = "0.14"

[lints]
workspace = true
