apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: byoridb-server
  namespace: byoridb
  labels:
    app.kubernetes.io/name: byoridb
    app.kubernetes.io/component: server
spec:
  serviceName: byoridb-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: byoridb
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: byoridb
        app.kubernetes.io/component: server
    spec:
      enableServiceLinks: false
      # Graceful shutdown must finish the redb checkpoint, or the next open runs
      # a multi-hour full repair on a large store (2026-06-29 incident: 100GB
      # redb). The shutdown sequence (drain ~25s + service stop ~30s + redb
      # checkpoint) overran the old 60s window → SIGKILL → unclean → repair on
      # every deploy. 300s leaves ample room for the checkpoint to complete.
      terminationGracePeriodSeconds: 300
      tolerations:
        - key: workload
          operator: Equal
          value: byoridb
          effect: NoSchedule
      nodeSelector:
        workload: byoridb
      containers:
        - name: byoridb-server
          # PLACEHOLDER TAG — the deploy workflow substitutes the real
          # commit-sha tag at apply time. Never `kubectl apply` this file
          # raw: it reverts the image, and a pod made NotReady by the revert
          # deadlocks StatefulSet updates (2026-06-11 incident).
          image: byoridbacr23236.azurecr.io/byoridb-server:1.0.1
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: byoridb-config
            - secretRef:
                name: byoridb-root
          env:
            # redb page cache, sized above the working set (data ~11-20GB) so
            # reads stay in memory. Cut 65536→32768 after the 2026-06-30 OOM:
            # 32GB amply covers the working set while leaving large headroom
            # under the 100Gi pod limit, so a heavy query can't push the node
            # into OOMKill (which forces a ~60min redb repair). Raise it back
            # toward 65536 only for a large bulk load (paired with a bigger node),
            # then restore.
            - name: BYORIDB_CACHE_SIZE_MB
              value: "32768"
            # NOTE: BYORIDB_DURABILITY was set to "none" (relaxed) for the
            # 2026-06-26 nexprice bulk load (88M nodes / 151M edges via the
            # bulkloader Job). Removed afterward — steady-state serving uses the
            # default Immediate (fsync per commit) durability. Re-add it (value
            # "none") only for the next large bulk load, then remove again.
            # Raise the per-scan row cap (default 100K) so global aggregation /
            # ORDER BY over the full dataset (product ~7.7M) is accurate, not a
            # 100K sample. Safe on the 128GB node; it's an OOM guard.
            - name: BYORIDB_MAX_SCAN_LIMIT
              value: "10000000"
          ports:
            - { containerPort: 9669,  name: grpc }
            - { containerPort: 19669, name: http }
          # redb's open() runs a FULL REPAIR (3 full scans of the file, db.rs:818)
          # whenever the previous shutdown was unclean (no allocator-state table).
          # On the 88M-vertex / 151M-edge nexprice dataset that scan takes 20min+.
          # A SIGKILL mid-repair leaves it unclean again → next open repairs again
          # → CrashLoopBackOff (2026-06-26 incident). startupProbe must outlast a
          # full repair so it can complete ONCE: repair finishes → clean state →
          # subsequent (graceful) restarts open fast. 60min ceiling = repair time
          # (~20min) + generous headroom; it is NOT per-restart downtime in steady
          # state. Lower this back toward ~5min once the data shrinks or quick-
          # repair (redb #829) lands.
          startupProbe:
            httpGet: { path: /health, port: 19669 }
            periodSeconds: 10
            failureThreshold: 360
          # /ready flips to 503 the moment a graceful shutdown starts, so the
          # pod leaves Service endpoints while in-flight queries drain. A bare
          # TCP probe stayed "ready" during shutdown (socket still listening).
          readinessProbe:
            httpGet: { path: /ready, port: 19669 }
            initialDelaySeconds: 5
            periodSeconds: 3
            # timeoutSeconds defaulted to 1s; a single slow /ready under load
            # then flapped the pod out of Service endpoints. 10s timeout + 3
            # failures tolerates transient slowness without dropping traffic.
            timeoutSeconds: 10
            failureThreshold: 3
          # 2026-06-30 incident: after a ~60min repair the server became ready
          # but /health (implicit 1s timeout) was slow during post-startup load
          # (cache warm), so liveness failed 4×15s=60s → SIGKILL *before* a clean
          # checkpoint → unclean → another 60min repair → loop. A 10s timeout and
          # 6 failures (90s) let the server stabilize and checkpoint.
          livenessProbe:
            httpGet: { path: /health, port: 19669 }
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests: { cpu: "2", memory: "8Gi" }
            limits:   { cpu: "14", memory: "100Gi" }
          volumeMounts:
            - { name: data, mountPath: /app/data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: managed-csi-premium
        resources:
          requests:
            storage: 128Gi
