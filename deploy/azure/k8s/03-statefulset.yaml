apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: byoridb-server
  namespace: byoridb
  labels:
    app.kubernetes.io/name: byoridb
    app.kubernetes.io/component: server
spec:
  serviceName: byoridb-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: byoridb
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: byoridb
        app.kubernetes.io/component: server
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      tolerations:
        - key: workload
          operator: Equal
          value: byoridb
          effect: NoSchedule
      nodeSelector:
        workload: byoridb
      containers:
        - name: byoridb-server
          # PLACEHOLDER TAG — the deploy workflow substitutes the real
          # commit-sha tag at apply time. Never `kubectl apply` this file
          # raw: it reverts the image, and a pod made NotReady by the revert
          # deadlocks StatefulSet updates (2026-06-11 incident).
          image: byoridbacr23236.azurecr.io/byoridb-server:1.0.1
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: byoridb-config
            - secretRef:
                name: byoridb-root
          env:
            # redb page cache, sized near the working set (data ~11-20GB) so
            # reads stay in memory and bulk loads don't hit the disk-IOPS wall.
            # Requires a node large enough to hold it (dbpoolv2 / E16s_v5 128GB).
            - name: BYORIDB_CACHE_SIZE_MB
              value: "65536"
            # BULK LOAD ONLY — relaxed durability (Durability::None + periodic
            # checkpoint every 64 commits) for fast ingestion. A crash loses the
            # last <=64 commits, recovered by re-loading (idempotent VIDs).
            # REMOVE this once bulk loading is done — steady-state serving needs
            # Immediate (fsync) durability. Delete the var → defaults to fsync.
            - name: BYORIDB_DURABILITY
              value: "none"
          ports:
            - { containerPort: 9669,  name: grpc }
            - { containerPort: 19669, name: http }
          # /ready flips to 503 the moment a graceful shutdown starts, so the
          # pod leaves Service endpoints while in-flight queries drain. A bare
          # TCP probe stayed "ready" during shutdown (socket still listening).
          readinessProbe:
            httpGet: { path: /ready, port: 19669 }
            initialDelaySeconds: 5
            periodSeconds: 3
            failureThreshold: 1
          livenessProbe:
            httpGet: { path: /health, port: 19669 }
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests: { cpu: "2", memory: "8Gi" }
            limits:   { cpu: "14", memory: "100Gi" }
          volumeMounts:
            - { name: data, mountPath: /app/data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: managed-csi-premium
        resources:
          requests:
            storage: 128Gi
