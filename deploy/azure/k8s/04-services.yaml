apiVersion: v1
kind: Service
metadata:
  name: byoridb-headless
  namespace: byoridb
  labels:
    app.kubernetes.io/name: byoridb
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: byoridb
    app.kubernetes.io/component: server
  ports:
    - { name: grpc, port: 9669,  targetPort: 9669 }
    - { name: http, port: 19669, targetPort: 19669 }
---
apiVersion: v1
kind: Service
metadata:
  name: byoridb-public
  namespace: byoridb
  labels:
    app.kubernetes.io/name: byoridb
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  # Bootstrap default only. The operator's IP is dynamic, so the live
  # allowlist is managed out-of-band with `kubectl patch` and deploy.yml
  # preserves whatever is currently on the cluster — this baked value is
  # used solely when the service is first created. Never rely on editing
  # this file to change the allowlist of a running cluster.
  # Placeholder (RFC 5737 doc range); set the real operator IP via:
  #   kubectl patch svc byoridb-public -n byoridb -p \
  #     '{"spec":{"loadBalancerSourceRanges":["<YOUR_IP>/32"]}}'
  loadBalancerSourceRanges:
    - 203.0.113.0/32
  selector:
    app.kubernetes.io/name: byoridb
    app.kubernetes.io/component: server
  ports:
    - { name: grpc, port: 9669,  targetPort: 9669 }
    - { name: http, port: 19669, targetPort: 19669 }
