worker_processes auto;
pid /tmp/nginx.pid;
# Error messages can include request URLs; emit no request logs at this boundary.
error_log /dev/null;
events { worker_connections 1024; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 2m;
    client_body_timeout 15s;
    keepalive_timeout 30s;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/byoridb/tls/active.conf;
    ssl_session_tickets off;
    ssl_session_cache shared:TLS:10m;

    server {
        listen 8443 ssl;
        http2 on;
        server_name _;
        add_header Strict-Transport-Security "max-age=31536000" always;
        # Exact API allowlist: ops, diagnostics, metrics and future routes stay private.
        location ~ ^/api/v1/(session|discover|query|query/json)$ {
            proxy_pass http://server:19669;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            # The backend uses its peer address for throttling, never untrusted XFF.
            proxy_set_header X-Forwarded-For "";
            proxy_set_header Forwarded "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
        location / { return 403; }
    }
    server {
        listen 9443 ssl;
        http2 on;
        server_name _;
        location ~ ^/graph\.GraphService/(Authenticate|SignOut|Execute|ExecuteJson|Discover)$ {
            grpc_pass grpc://server:9669;
            grpc_set_header X-Forwarded-For "";
            grpc_set_header Forwarded "";
            grpc_connect_timeout 5s;
            grpc_read_timeout 120s;
            grpc_send_timeout 120s;
        }
        location / { return 403; }
    }
}
