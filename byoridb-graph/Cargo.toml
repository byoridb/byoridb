[package]
name = "byoridb-graph"
version.workspace = true
edition = "2021"
license = "Apache-2.0"

[features]
default = []
# Network servers (gRPC via tonic + HTTP via axum), the Prometheus exporter, and
# tracing-subscriber logging init. Off for embedded/in-process use; the
# standalone server crate turns it on. Forwards the network layers down the
# stack (storage RPC + meta server). (`metrics` facade stays always-on — the
# execute path records through it.) The KV backend (redb) is always available.
server = [
    "dep:tonic",
    "dep:tonic-prost",
    "dep:prost",
    "dep:axum",
    "dep:metrics-exporter-prometheus",
    "dep:tracing-subscriber",
    "byoridb-storage/distributed",
    "byoridb-meta/server",
]

[dependencies]
byoridb-common = { path = "../byoridb-common" }
byoridb-storage = { path = "../byoridb-storage" }
byoridb-parser = { path = "../byoridb-parser" }
byoridb-executor = { path = "../byoridb-executor" }
byoridb-kvstore = { path = "../byoridb-kvstore" }
byoridb-meta = { path = "../byoridb-meta" }
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }
parking_lot = { workspace = true }
dashmap = { workspace = true }
tonic = { workspace = true, optional = true }
tonic-prost = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true, optional = true }
argon2 = "0.5"
regex = { workspace = true }

[build-dependencies]
tonic-prost-build = "0.14"

[lints]
workspace = true
