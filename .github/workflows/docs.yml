name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'book/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'book/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

env:
  MDBOOK_VERSION: 0.4.52

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Cache mdBook binary
        id: cache-mdbook
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/mdbook
          key: mdbook-${{ env.MDBOOK_VERSION }}-x86_64-unknown-linux-gnu

      - name: Install mdBook
        if: steps.cache-mdbook.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/.cargo/bin
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C $HOME/.cargo/bin

      - name: Add mdBook to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Verify English/Korean page parity
        shell: bash
        run: |
          find book/src -type f -name '*.md' -print \
            | sed 's#^book/src/##' | sort > /tmp/byoridb-docs-en.txt
          find book/src.ko -type f -name '*.md' -print \
            | sed 's#^book/src.ko/##' | sort > /tmp/byoridb-docs-ko.txt
          diff -u /tmp/byoridb-docs-en.txt /tmp/byoridb-docs-ko.txt

      - name: Build English book
        run: mdbook build book

      - name: Build Korean book
        run: mdbook build book/ko

      - name: Verify bilingual output
        run: |
          test -f book/book/index.html
          test -f book/book/ko/index.html

      - name: Setup Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'book/book'

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
