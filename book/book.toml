[book]
title = "ByoriDB Documentation"
authors = ["ByoriDB Team"]
description = "A distributed graph database written in Rust"
language = "en"
multilingual = false
src = "src"

[build]
build-dir = "book"
create-missing = true

[output.html]
default-theme = "rust"
preferred-dark-theme = "coal"
git-repository-url = "https://github.com/byoridb/byoridb"
edit-url-template = "https://github.com/byoridb/byoridb/edit/main/book/src/{path}"
site-url = "/byoridb/"

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30
use-hierarchical-tree = true
expand = true
