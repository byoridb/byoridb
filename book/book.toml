[book]
title = "ByoriDB Documentation"
authors = ["ByoriDB Contributors"]
description = "An ontology graph database written in Rust (nGQL-compatible, RDFS-Plus reasoning; distribution on the roadmap)"
language = "en"
multilingual = false
src = "src"

[rust]
edition = "2021"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "rust"
preferred-dark-theme = "coal"
git-repository-url = "https://github.com/byoridb/byoridb"
edit-url-template = "https://github.com/byoridb/byoridb/edit/main/book/{path}"
site-url = "/byoridb/"

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30
use-hierarchical-tree = true
expand = true
