[package]
name = "byoridb-bulkloader"
version = "0.1.0"
edition = "2021"
description = "Offline bulk loader: writes vertices/edges directly into the redb store, bypassing nGQL/HTTP"
license = "Apache-2.0"

[[bin]]
name = "byoridb-bulkloader"
path = "src/main.rs"

[dependencies]
byoridb-common = { path = "../byoridb-common" }
byoridb-codec = { path = "../byoridb-codec" }
byoridb-kvstore = { path = "../byoridb-kvstore" }
anyhow = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
csv = { workspace = true }
flate2 = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# Only to assert our key formats stay byte-identical to the engine's SchemaKey.
byoridb-executor = { path = "../byoridb-executor" }
tempfile = "3.10"

[lints]
workspace = true
