[package]
name = "byoridb"
version.workspace = true
edition = "2021"
authors = ["ByoriDB Contributors"]
description = "A fast, durable ontology graph database built in Rust (nGQL-compatible, RDFS-Plus reasoning; distribution on the roadmap)"
license = "Apache-2.0"
repository = "https://github.com/byoridb/byoridb"

[[bin]]
name = "byoridb-server"
path = "src/main.rs"

[[bin]]
name = "byoridb-backup"
path = "src/backup_cli.rs"

# The server binaries enable the network layers (`server` on graph forwards to
# storage RPC + meta server). The KV backend (redb) is pure-Rust and always on,
# so there's no storage feature to flip anymore.
[dependencies]
byoridb-common = { path = "byoridb-common" }
byoridb-graph = { path = "byoridb-graph", features = ["server"] }
byoridb-storage = { path = "byoridb-storage", features = ["distributed"] }
byoridb-meta = { path = "byoridb-meta", features = ["server"] }
byoridb-kvstore = { path = "byoridb-kvstore" }
byoridb-codec = { path = "byoridb-codec" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
config = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true }
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
byoridb-common = { path = "byoridb-common" }
byoridb-parser = { path = "byoridb-parser" }
byoridb-executor = { path = "byoridb-executor" }
byoridb-kvstore = { path = "byoridb-kvstore" }
byoridb-storage = { path = "byoridb-storage", features = ["distributed"] }
byoridb-meta = { path = "byoridb-meta", features = ["server"] }
byoridb-graph = { path = "byoridb-graph", features = ["server"] }
serde_json = { workspace = true }
tokio = { workspace = true }
criterion = "0.5"
tempfile = "3.10"

[features]
# Distributed E2E tests (tests/distributed_e2e_test.rs) reach into the gated
# layers of the executor/storage dev-dependencies. CI runs `--all-features`,
# which turns this on; embedded/default builds keep it off so the distributed
# test is configured out instead of failing to compile.
distributed = ["byoridb-executor/distributed", "byoridb-storage/distributed"]

# One version for every crate in the workspace, so `byoridb-server --version`
# and `byoridb-cli --version` cannot disagree about which release they came
# from. Members were pinned at 0.1.0 while the root package moved to 0.3.3,
# which meant a v0.3.3 archive shipped a CLI that called itself 0.1.0.
[workspace.package]
version = "0.4.16"

[workspace]
members = [
    "byoridb-common",
    "byoridb-storage",
    "byoridb-graph",
    "byoridb-meta",
    "byoridb-kvstore",
    "byoridb-codec",
    "byoridb-parser",
    "byoridb-executor",
    "byoridb-client",
    "byoridb-bulkloader",
]

[[example]]
name = "basic_usage"
path = "examples/basic_usage.rs"

[[bench]]
name = "benchmark"
harness = false

[[bench]]
name = "e2e_benchmark"
harness = false

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
regex = "1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Vector ANN (PLAN.md R-2b) — pure-Rust HNSW, serde-serializable to redb
instant-distance = { version = "0.6", features = ["with-serde"] }

# Storage
redb = "4.1"

# Networking
tonic = { version = "0.14", features = ["gzip", "zstd"] }
tonic-prost = "0.14"
prost = "0.14"
axum = "0.8"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = "0.18"

# Bulk load (byoridb-bulkloader)
csv = "1.3"
flate2 = "1.0"

# Utilities
bytes = "1.7"
parking_lot = "0.12"
dashmap = "6.1"
bumpalo = { version = "3.16", features = ["collections"] }
futures = "0.3"
tokio-stream = "0.1"

# Raft consensus - implemented in byoridb-storage/src/raft/
# Note: openraft has compatibility issues with Rust 1.87+ (validit crate)
# Using custom implementation instead

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[workspace.lints.clippy]
cognitive_complexity = "warn"
