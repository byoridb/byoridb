[package]
name = "byoridb-client"
version.workspace = true
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "byoridb-cli"
path = "src/bin/byoridb-cli.rs"

[dependencies]
tokio = { workspace = true }
anyhow = "1.0"
clap = { version = "4.5.54", features = ["derive", "env"] }
rustyline = "18.0"
tonic = { workspace = true }
tonic-prost = { workspace = true }
prost = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
byoridb-common = { path = "../byoridb-common" }
comfy-table = "=7.1.1"
colored = "2.1"

[build-dependencies]
tonic-prost-build = "0.14"

[lints]
workspace = true
